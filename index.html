<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Expense Tracker</h1>
<form id="form" class="card grid">
<input id="desc" placeholder="Description" maxlength="60" required aria-label="Description">
<input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required aria-label="Amount">
<select id="cat" aria-label="Category"></select>
<input id="date" type="date" required aria-label="Date">
<button class="primary">Add expense</button>
</form>
<section class="card"><div class="row top"><div><p class="muted">Total</p><p id="total" class="big"></p></div><select id="filter" aria-label="Filter by category"></select></div><div id="bars"></div></section>
<ul id="list"></ul><p id="empty" class="muted" hidden>No expenses yet.</p>
</main><script src="script.js"></script></body></html>
